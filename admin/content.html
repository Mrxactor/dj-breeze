<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ Breeze Admin — Content</title><style>:root{--bg:#080808;--p:#111;--p2:#171717;--t:#f4f1e9;--m:#999;--l:#292929;--ok:#9be6aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.w{width:min(calc(100% - 28px),1180px);margin:auto;padding:28px 0 80px}.top,.hero,.tabs,.actions{display:flex;gap:12px;align-items:center}.top{justify-content:space-between;margin-bottom:30px}.brand{font-size:25px;font-weight:950;letter-spacing:-.05em}.brand small{font-size:10px;letter-spacing:.15em;color:#777;margin-left:8px}.back{color:#aaa;text-decoration:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.hero{justify-content:space-between;align-items:end;margin-bottom:24px}.hero h1{font-size:clamp(44px,7vw,86px);line-height:.88;letter-spacing:-.065em;margin:0}.hero p{max-width:560px;color:#999;line-height:1.55;margin:0}.box{border:1px solid var(--l);background:var(--p);padding:20px}.login{width:min(100%,520px)}.hidden{display:none!important}.tabs{flex-wrap:wrap;margin:22px 0}.tab,.btn{border:1px solid #343434;background:#151515;color:#fff;border-radius:999px;padding:10px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.11em;cursor:pointer;text-decoration:none}.tab.active,.btn.primary{background:#f2eee5;color:#090909;border-color:#f2eee5}.section{display:none}.section.active{display:block}.section h2{font-size:34px;letter-spacing:-.04em;margin:0 0 8px}.lead,.status{font-size:12px;color:#999;line-height:1.55}.lead{font-size:14px;margin:0 0 18px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888}.field input,.field textarea{width:100%;border:1px solid #333;background:#0d0d0d;color:#fff;padding:12px;border-radius:9px;font:inherit}.field textarea{min-height:90px;resize:vertical}.group{grid-column:1/-1;background:var(--p2);border:1px solid #242424;padding:14px}.group h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.11em;color:#aaa}.status.ok{color:var(--ok)}@media(max-width:760px){.hero{display:block}.hero p{margin-top:14px}.form{grid-template-columns:1fr}.field.full,.group{grid-column:auto}}</style></head><body><div class="w"><div class="top"><div class="brand">DJ BREEZE <small>ADMIN / CONTENT</small></div><a class="back" href="./">← Admin</a></div><div class="hero"><h1>EDIT THE<br>WEBSITE.</h1><p>Vanliga formulär i stället för HTML eller GitHub. Ändringar sparas direkt i Supabase och läses av hemsidan.</p></div><div id="setup" class="box hidden">Backend är inte kopplad.</div><div id="login" class="box login hidden"><h2>Admin login</h2><form id="loginForm" class="form"><div class="field full"><label>Email</label><input id="email" type="email" required></div><div class="field full"><label>Password</label><input id="password" type="password" required></div><div><button class="btn primary">Log in</button></div><div id="loginStatus" class="status"></div></form></div><div id="app" class="hidden"><div class="tabs" id="tabs"></div><div id="sections"></div></div></div><script>
let cfg=null,token=sessionStorage.getItem('dj_breeze_admin_token')||'',blocks={};const $=s=>document.querySelector(s),base=()=>cfg.url.replace(/\/$/,'');
const definitions={
 manifesto:{label:'Point of view',lead:'Huvudbudskapet på den ljusa sektionen.',fields:[['kicker','Kicker'],['heading','Heading','textarea'],['lead','Lead','textarea'],['body','Body','textarea']],groups:[{key:'meta',title:'Three highlights',count:3,fields:[['value','Value'],['label','Label']]}]},
 sound:{label:'The Sound',lead:'Rubriker och de tre musik-erorna.',fields:[['kicker','Kicker'],['heading','Heading','textarea'],['intro','Intro','textarea']],groups:[{key:'cards',title:'Sound cards',count:3,fields:[['num','Small label'],['title','Title'],['body','Text','textarea']]}]},
 live:{label:'Live',lead:'Rubriken ovanför livegalleriet.',fields:[['kicker','Kicker'],['heading','Heading','textarea'],['intro','Intro','textarea']]},
 archive:{label:'Archive',lead:'Rubriken ovanför flyerarkivet.',fields:[['kicker','Kicker'],['heading','Heading','textarea'],['intro','Intro','textarea']]},
 services:{label:'Booking types',lead:'Texten för de fem bokningstyperna.',fields:[['kicker','Kicker'],['heading','Heading','textarea']],groups:[{key:'items',title:'Booking rows',count:5,fields:[['title','Title'],['tag','Tag']]}]},
 booking:{label:'Booking CTA',lead:'Texten ovanför bokningsformuläret.',fields:[['kicker','Kicker'],['heading','Heading','textarea'],['intro','Intro','textarea']]},
 footer:{label:'Footer',lead:'Text längst ner på hemsidan.',fields:[['handle','Handle'],['line1','Line 1'],['line2','Line 2']]},
 navigation:{label:'Navigation',lead:'Namnen i toppmenyn.',fields:[['sound','Sound'],['live','Live'],['events','Events'],['booking','Booking']]}
};
async function api(path,o={}){const h=Object.assign({apikey:cfg.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},o.headers||{}),r=await fetch(base()+path,Object.assign({},o,{headers:h}));if(r.status===401){sessionStorage.removeItem('dj_breeze_admin_token');location.reload();throw Error('Session expired')}if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function init(){try{const r=await fetch('../content/backend.json',{cache:'no-store'});if(r.ok)cfg=await r.json()}catch(e){}if(!cfg||!cfg.enabled){$('#setup').classList.remove('hidden');return}if(token){$('#app').classList.remove('hidden');await load()}else $('#login').classList.remove('hidden')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const st=$('#loginStatus');st.textContent='Logging in…';try{const r=await fetch(base()+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})}),d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error_description||d.msg||'Login failed');token=d.access_token;sessionStorage.setItem('dj_breeze_admin_token',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(x){st.textContent=x.message}});
async function load(){const rows=await api('/rest/v1/content_blocks?select=*&order=key');rows.forEach(r=>blocks[r.key]=r.data||{});render()}
function render(){const tabs=$('#tabs'),sections=$('#sections');tabs.innerHTML='';sections.innerHTML='';Object.entries(definitions).forEach(([key,d],i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=d.label;b.onclick=()=>activate(key);b.dataset.key=key;tabs.appendChild(b);const sec=document.createElement('section');sec.id='sec-'+key;sec.className='section'+(i===0?' active':'');sec.innerHTML=sectionHtml(key,d,blocks[key]||{});sections.appendChild(sec);sec.querySelector('form').addEventListener('submit',e=>save(e,key,d))})}
function inputHtml(id,label,type,val){const v=String(val??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');return `<div class="field${type==='textarea'?' full':''}"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${v}</textarea>`:`<input id="${id}" value="${v}">`}</div>`}
function sectionHtml(key,d,data){let h=`<div class="box"><h2>${d.label}</h2><p class="lead">${d.lead}</p><form class="form">`;d.fields.forEach(f=>h+=inputHtml(`${key}-${f[0]}`,f[1],f[2],data[f[0]]));(d.groups||[]).forEach(g=>{h+=`<div class="group"><h3>${g.title}</h3><div class="form">`;for(let i=0;i<g.count;i++){const row=(data[g.key]||[])[i]||{};g.fields.forEach(f=>h+=inputHtml(`${key}-${g.key}-${i}-${f[0]}`,`${i+1}. ${f[1]}`,f[2],row[f[0]]))}h+='</div></div>'});h+=`<div class="field full"><div class="actions"><button class="btn primary">Save ${d.label}</button></div><div class="status" id="status-${key}"></div></div></form></div>`;return h}
function activate(key){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.key===key));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id==='sec-'+key));history.replaceState(null,'','#'+key)}
async function save(e,key,d){e.preventDefault();const data={};d.fields.forEach(f=>data[f[0]]=$(`#${key}-${f[0]}`).value);(d.groups||[]).forEach(g=>{data[g.key]=[];for(let i=0;i<g.count;i++){const row={};g.fields.forEach(f=>row[f[0]]=$(`#${key}-${g.key}-${i}-${f[0]}`).value);if(key==='services'){row.type=['club','wedding','private','corporate','public'][i]}data[g.key].push(row)}});const st=$('#status-'+key);st.textContent='Saving…';try{await api('/rest/v1/content_blocks?key=eq.'+encodeURIComponent(key),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({data})});blocks[key]=data;st.textContent='Saved. Website will use this content immediately.';st.classList.add('ok')}catch(err){st.textContent=err.message;st.classList.remove('ok')}}
init().then(()=>{const k=location.hash.slice(1);if(k&&definitions[k])activate(k)});
</script></body></html>
