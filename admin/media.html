<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ Breeze Admin — Media</title><style>:root{--bg:#080808;--p:#111;--p2:#171717;--t:#f4f1e9;--m:#999;--l:#292929;--ok:#9be6aa;--bad:#ff9d9d;--warn:#ffd179}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.w{width:min(calc(100% - 28px),1240px);margin:auto;padding:28px 0 80px}.top,.hero,.actions,.filters{display:flex;gap:12px;align-items:center}.top{justify-content:space-between;margin-bottom:30px}.brand{font-size:25px;font-weight:950;letter-spacing:-.05em}.brand small{font-size:10px;letter-spacing:.15em;color:#777;margin-left:8px}.back{color:#aaa;text-decoration:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.hero{justify-content:space-between;align-items:end;margin-bottom:24px}.hero h1{font-size:clamp(44px,7vw,86px);line-height:.88;letter-spacing:-.065em;margin:0}.hero p{max-width:560px;color:#999;line-height:1.55;margin:0}.box,.item{border:1px solid var(--l);background:var(--p);padding:18px}.login{width:min(100%,520px)}.hidden{display:none!important}.btn,.filter{border:1px solid #343434;background:#151515;color:#fff;border-radius:999px;padding:10px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.11em;cursor:pointer;text-decoration:none}.btn.primary,.filter.active{background:#f2eee5;color:#090909;border-color:#f2eee5}.btn.danger{border-color:#704545}.btn.ok{border-color:#42684c}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#888}.field input,.field select,.field textarea{width:100%;border:1px solid #333;background:#0d0d0d;color:#fff;padding:12px;border-radius:9px;font:inherit}.field textarea{min-height:90px;resize:vertical}.checks{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;color:#aaa;font-size:12px}.check input{width:auto}.status{font-size:12px;color:#999;line-height:1.5}.status.ok{color:var(--ok)}.filters{flex-wrap:wrap;margin:18px 0}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{padding:0;overflow:hidden}.thumb{aspect-ratio:16/10;background:#050505;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.thumb.audio{font-size:42px}.body{padding:16px}.body h3{font-size:22px;letter-spacing:-.04em;margin:0 0 6px}.meta{font-size:11px;color:#888;line-height:1.5;margin-bottom:12px}.pill{display:inline-block;border:1px solid #353535;border-radius:999px;padding:6px 8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin:0 5px 8px 0}.pill.hero{color:var(--ok)}.pill.draft{color:var(--warn)}.empty{grid-column:1/-1;text-align:center;padding:42px;border:1px dashed #2d2d2d;color:#777}@media(max-width:900px){.list{grid-template-columns:1fr 1fr}}@media(max-width:680px){.hero{display:block}.hero p{margin-top:14px}.form,.list{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div class="w"><div class="top"><div class="brand">DJ BREEZE <small>ADMIN / MEDIA</small></div><a class="back" href="./">← Admin</a></div><div class="hero"><h1>MEDIA<br>LIBRARY.</h1><p>Ladda upp bilder, videos och MP3 till Supabase. Kategorisera material, sätt Hero eller website soundtrack och publicera utan GitHub.</p></div><div id="setup" class="box hidden">Backend är inte kopplad.</div><div id="login" class="box login hidden"><h2>Admin login</h2><form id="loginForm" class="form"><div class="field full"><label>Email</label><input id="email" type="email" required></div><div class="field full"><label>Password</label><input id="password" type="password" required></div><div><button class="btn primary">Log in</button></div><div id="loginStatus" class="status"></div></form></div><div id="app" class="hidden"><div class="box"><h2 id="formTitle">Add media</h2><form id="mediaForm" class="form"><input id="mediaId" type="hidden"><input id="storagePath" type="hidden"><input id="existingUrl" type="hidden"><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Type</label><select id="kind"><option value="image">Image</option><option value="video">Video</option><option value="audio">Audio</option></select></div><div class="field"><label>Category</label><select id="category"><option value="live">Live Gallery</option><option value="archive">Flyer Archive</option><option value="sound">Sound Cards</option><option value="club">Club</option><option value="wedding">Wedding</option><option value="private">Private</option><option value="corporate">Corporate</option><option value="public">Public Event</option><option value="hero">Hero</option><option value="general">General</option></select></div><div class="field"><label>Event date (optional)</label><input id="eventDate" type="date"></div><div class="field"><label>Venue (optional)</label><input id="venue"></div><div class="field"><label>Poster URL (optional)</label><input id="poster"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field full"><label>File — leave empty when editing to keep current file</label><input id="file" type="file"></div><div class="field"><label>Sort order</label><input id="sortOrder" type="number" value="0"></div><div class="field"><label>External URL (optional)</label><input id="externalUrl"></div><div class="field full"><div class="checks"><label class="check"><input id="featured" type="checkbox"> Featured</label><label class="check"><input id="published" type="checkbox" checked> Published</label></div></div><div class="field full"><div class="actions"><button class="btn primary">Save media</button><button class="btn" type="button" id="clear">Clear</button></div><div id="formStatus" class="status"></div></div></form></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="image">Images</button><button class="filter" data-filter="video">Videos</button><button class="filter" data-filter="audio">Audio</button><button class="filter" data-filter="hero">Hero</button></div><div id="list" class="list"></div></div></div><script>
let cfg=null,token=sessionStorage.getItem('dj_breeze_admin_token')||'',rows=[],filter='all';const $=s=>document.querySelector(s),base=()=>cfg.url.replace(/\/$/,'');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,o={}){const h=Object.assign({apikey:cfg.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},o.headers||{}),r=await fetch(base()+path,Object.assign({},o,{headers:h}));if(r.status===401){sessionStorage.removeItem('dj_breeze_admin_token');location.reload();throw Error('Session expired')}if(!r.ok)throw Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function upload(file,prefix){const clean=(file.name||'file').replace(/[^a-zA-Z0-9._-]+/g,'-'),path=prefix+'/'+Date.now()+'-'+clean;const r=await fetch(base()+'/storage/v1/object/dj-breeze-media/'+encodeURI(path),{method:'POST',headers:{apikey:cfg.anonKey,Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream'},body:file});if(!r.ok)throw Error(await r.text());return{path,url:base()+'/storage/v1/object/public/dj-breeze-media/'+encodeURI(path)}}
async function init(){try{const r=await fetch('../content/backend.json',{cache:'no-store'});if(r.ok)cfg=await r.json()}catch(e){}if(!cfg||!cfg.enabled){$('#setup').classList.remove('hidden');return}if(token){$('#app').classList.remove('hidden');await load()}else $('#login').classList.remove('hidden')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const st=$('#loginStatus');st.textContent='Logging in…';try{const r=await fetch(base()+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:cfg.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})}),d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error_description||d.msg||'Login failed');token=d.access_token;sessionStorage.setItem('dj_breeze_admin_token',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(x){st.textContent=x.message}});
async function load(){rows=await api('/rest/v1/media_items?select=*&order=sort_order.asc,created_at.desc');render()}
function render(){let r=rows;if(filter==='hero')r=rows.filter(x=>x.is_hero);else if(filter!=='all')r=rows.filter(x=>x.kind===filter);const list=$('#list');if(!r.length){list.innerHTML='<div class="empty">No media in this filter.</div>';return}list.innerHTML=r.map(m=>{const thumb=m.kind==='image'?`<div class="thumb"><img src="${esc(m.file_url)}" alt=""></div>`:m.kind==='video'?`<div class="thumb"><video src="${esc(m.file_url)}" ${m.poster_url?`poster="${esc(m.poster_url)}"`:''} muted playsinline preload="metadata"></video></div>`:'<div class="thumb audio">♫</div>';return `<article class="item">${thumb}<div class="body"><span class="pill">${esc(m.kind)}</span><span class="pill">${esc(m.category)}</span>${m.is_hero?'<span class="pill hero">Hero</span>':''}${!m.is_published?'<span class="pill draft">Draft</span>':''}<h3>${esc(m.title)}</h3><div class="meta">${esc([m.venue,m.event_date].filter(Boolean).join(' · ')||m.description||'')}</div><div class="actions"><button class="btn" onclick="editMedia('${m.id}')">Edit</button>${m.kind==='video'?`<button class="btn ok" onclick="setHero('${m.id}')">Set Hero</button>`:''}${m.kind==='audio'?`<button class="btn ok" onclick="setSound('${m.id}')">Set Sound</button>`:''}<button class="btn danger" onclick="removeMedia('${m.id}')">Delete</button></div></div></article>`}).join('')}
function editMedia(id){const m=rows.find(x=>x.id===id);if(!m)return;$('#mediaId').value=m.id;$('#storagePath').value=m.storage_path||'';$('#existingUrl').value=m.file_url||'';$('#title').value=m.title||'';$('#kind').value=m.kind;$('#category').value=m.category||'general';$('#eventDate').value=m.event_date||'';$('#venue').value=m.venue||'';$('#poster').value=m.poster_url||'';$('#description').value=m.description||'';$('#sortOrder').value=m.sort_order||0;$('#externalUrl').value=m.external_url||'';$('#featured').checked=!!m.featured;$('#published').checked=!!m.is_published;$('#formTitle').textContent='Edit media';$('#formStatus').textContent='';scrollTo({top:0,behavior:'smooth'})}
function clearForm(){$('#mediaForm').reset();$('#mediaId').value='';$('#storagePath').value='';$('#existingUrl').value='';$('#sortOrder').value='0';$('#published').checked=true;$('#formTitle').textContent='Add media';$('#formStatus').textContent=''}$('#clear').onclick=clearForm;
$('#mediaForm').addEventListener('submit',async e=>{e.preventDefault();const st=$('#formStatus'),id=$('#mediaId').value,file=$('#file').files[0];st.textContent='Saving…';try{let url=$('#existingUrl').value,path=$('#storagePath').value;if(file){const up=await upload(file,$('#kind').value);url=up.url;path=up.path}if(!url)throw Error('Choose a file.');const payload={title:$('#title').value.trim(),kind:$('#kind').value,category:$('#category').value,event_date:$('#eventDate').value||null,venue:$('#venue').value.trim()||null,poster_url:$('#poster').value.trim()||null,description:$('#description').value.trim()||null,sort_order:Number($('#sortOrder').value)||0,external_url:$('#externalUrl').value.trim()||null,featured:$('#featured').checked,is_published:$('#published').checked,file_url:url,storage_path:path||null};if(id)await api('/rest/v1/media_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});else await api('/rest/v1/media_items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});st.textContent='Saved.';st.classList.add('ok');clearForm();await load()}catch(err){st.textContent=err.message;st.classList.remove('ok')}});
async function setHero(id){const m=rows.find(x=>x.id===id);if(!m||m.kind!=='video')return;try{await api('/rest/v1/media_items?is_hero=eq.true',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_hero:false})});await api('/rest/v1/media_items?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_hero:true,featured:true,is_published:true})});await api('/rest/v1/site_settings?id=eq.1',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({hero_video_url:m.file_url,hero_poster_url:m.poster_url||null})});await load()}catch(err){alert(err.message)}}
async function setSound(id){const m=rows.find(x=>x.id===id);if(!m||m.kind!=='audio')return;try{await api('/rest/v1/site_settings?id=eq.1',{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({site_sound_url:m.file_url,site_sound_enabled:true})});alert('Website soundtrack updated.')}catch(err){alert(err.message)}}
async function removeMedia(id){const m=rows.find(x=>x.id===id);if(!m||!confirm('Delete '+m.title+'?'))return;try{await api('/rest/v1/media_items?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});if(m.storage_path){const r=await fetch(base()+'/storage/v1/object/dj-breeze-media/'+encodeURI(m.storage_path),{method:'DELETE',headers:{apikey:cfg.anonKey,Authorization:'Bearer '+token}});if(!r.ok)console.warn('Storage file could not be removed')}await load()}catch(err){alert(err.message)}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
init();
</script></body></html>
