name: Fix mobile media fit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-media-fit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep artwork and photos fully visible on mobile
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  /* Mobile media fit: preserve full artwork and photos. */'
          css='''\n  /* Mobile media fit: preserve full artwork and photos. */\n  @media (max-width:820px){\n    /* Sound cards: show the full artwork first, then the copy below it. */\n    #sound .era-card{\n      min-height:0 !important;\n      height:auto !important;\n      display:flex;\n      flex-direction:column;\n      overflow:hidden;\n    }\n    #sound .era-card img{\n      position:relative !important;\n      inset:auto !important;\n      width:100% !important;\n      height:auto !important;\n      max-height:none !important;\n      object-fit:contain !important;\n      background:#111;\n      transform:none !important;\n    }\n    #sound .era-card::after{display:none !important}\n    #sound .era-copy{\n      position:relative !important;\n      left:auto !important;right:auto !important;bottom:auto !important;\n      padding:18px 18px 20px;\n      background:#111;\n    }\n\n    /* Live gallery: consistent frames, no oversized crops. */\n    #live .gallery{\n      grid-template-columns:1fr !important;\n      grid-template-rows:none !important;\n      gap:10px;\n    }\n    #live .tile,#live .tile.tall{\n      width:100%;\n      height:auto !important;\n      aspect-ratio:4/3;\n      grid-column:auto !important;\n      grid-row:auto !important;\n      background:#0d0d0d;\n    }\n    #live .tile img,#live .tile video{\n      width:100% !important;\n      height:100% !important;\n      object-fit:contain !important;\n      object-position:center center !important;\n      background:#0d0d0d;\n      transform:none !important;\n    }\n\n    /* Flyer archive: same frame for every flyer, full artwork visible. */\n    .poster-rail{align-items:stretch}\n    .poster img,.poster:nth-child(2) img{\n      width:100%;\n      aspect-ratio:3/4 !important;\n      height:auto !important;\n      object-fit:contain !important;\n      object-position:center center !important;\n      background:#0e0e0e;\n      transform:none !important;\n    }\n  }\n\n  @media (max-width:640px){\n    #sound .era-copy h3{font-size:34px}\n    #sound .era-copy p{font-size:14px;line-height:1.45}\n    #live .tile,#live .tile.tall{aspect-ratio:4/3}\n    .poster-rail{grid-template-columns:1fr 1fr}\n  }\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile image sizing and cropping [skip ci]"
          git push
