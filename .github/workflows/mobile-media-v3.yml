name: Mobile media v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-media-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile artwork substantially smaller
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  /* Mobile media scale v3: compact phone layout. */'
          css='''\n  /* Mobile media scale v3: compact phone layout. */\n  @media (max-width:640px){\n    #sound .era-grid{gap:10px !important}\n    #sound .era-card{max-width:420px !important;margin-inline:auto !important}\n    #sound .era-card img{\n      height:140px !important;\n      max-height:140px !important;\n      object-fit:contain !important;\n      object-position:center !important;\n    }\n    #sound .era-copy{padding:10px 12px 13px !important}\n    #sound .era-copy h3{font-size:24px !important;line-height:.95 !important;margin:5px 0 6px !important}\n    #sound .era-copy p{font-size:11px !important;line-height:1.35 !important}\n\n    #live .gallery{\n      max-width:460px !important;\n      grid-template-columns:repeat(2,minmax(0,1fr)) !important;\n      gap:7px !important;\n      margin-inline:auto !important;\n    }\n    #live .tile,#live .tile.tall,#live .tile.tall:first-child{\n      grid-column:auto !important;\n      grid-row:auto !important;\n      width:100% !important;\n      max-width:none !important;\n      height:auto !important;\n      aspect-ratio:4/3 !important;\n    }\n    #live .tile img,#live .tile video{\n      width:100% !important;\n      height:100% !important;\n      object-fit:contain !important;\n      object-position:center !important;\n    }\n    #live .tile .tag{font-size:7px !important;padding:5px 7px !important;left:6px !important;bottom:6px !important}\n\n    .poster-rail{\n      max-width:420px !important;\n      margin-inline:auto !important;\n      grid-template-columns:repeat(3,minmax(0,1fr)) !important;\n      gap:7px !important;\n      justify-content:center !important;\n    }\n    .poster{max-width:none !important;width:100% !important}\n    .poster img,.poster:nth-child(2) img{\n      width:100% !important;\n      height:auto !important;\n      aspect-ratio:3/4 !important;\n      object-fit:contain !important;\n      object-position:center !important;\n    }\n    .poster-cap{font-size:6px !important;padding:4px 0 !important;gap:4px !important}\n\n    #live.section{padding-bottom:56px !important}\n    .posters{padding-top:56px !important}\n  }\n\n  @media (max-width:420px){\n    #sound .era-card img{height:118px !important;max-height:118px !important}\n    #sound .era-copy h3{font-size:22px !important}\n    #live .gallery{max-width:330px !important}\n    .poster-rail{max-width:330px !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important}\n  }\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make mobile media more compact [skip ci]"
          git push
