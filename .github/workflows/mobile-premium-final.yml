name: Install premium mobile layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-premium-final.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove patch stack and load dedicated responsive stylesheet
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  /* Mobile navigation + readable archive captions. */'
          start=s.find(marker)
          style_end=s.find('</style>', start) if start != -1 else -1
          if start != -1 and style_end != -1:
              s=s[:start] + s[style_end:]
          link='<link rel="stylesheet" href="css/mobile-premium.css?v=20260910-1">'
          if link not in s:
              s=s.replace('</style>','</style>\n'+link,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace mobile patch stack with dedicated premium responsive layout [skip ci]"
          git push
