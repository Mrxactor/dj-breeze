name: Refine mobile media scale
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-mobile-media-scale.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce oversized mobile media while preserving full artwork
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  /* Mobile media scale v2: smaller, balanced, fully visible. */'
          css='''\n  /* Mobile media scale v2: smaller, balanced, fully visible. */\n  @media (max-width:820px){\n    /* Sound cards: keep artwork readable without letting it dominate the screen. */\n    #sound .era-grid{gap:12px}\n    #sound .era-card{\n      width:100%;\n      max-width:560px;\n      margin-inline:auto;\n      min-height:0 !important;\n      height:auto !important;\n    }\n    #sound .era-card img{\n      width:100% !important;\n      height:clamp(180px,42vw,250px) !important;\n      max-height:250px !important;\n      object-fit:contain !important;\n      object-position:center !important;\n    }\n    #sound .era-copy{padding:14px 16px 17px !important}\n    #sound .era-copy h3{font-size:30px !important;margin:6px 0 8px}\n    #sound .era-copy p{font-size:13px !important;line-height:1.42}\n\n    /* Live section: one modest featured frame + compact supporting tiles. */\n    #live .gallery{\n      width:100%;\n      max-width:620px;\n      margin-inline:auto;\n      display:grid !important;\n      grid-template-columns:repeat(2,minmax(0,1fr)) !important;\n      grid-template-rows:none !important;\n      gap:8px !important;\n    }\n    #live .tile,#live .tile.tall{\n      width:100% !important;\n      height:auto !important;\n      aspect-ratio:4/3 !important;\n      grid-column:auto !important;\n      grid-row:auto !important;\n      min-height:0 !important;\n    }\n    #live .tile.tall:first-child{\n      grid-column:1/-1 !important;\n      aspect-ratio:16/9 !important;\n      max-width:520px;\n      justify-self:center;\n    }\n    #live .tile img,#live .tile video{\n      width:100% !important;\n      height:100% !important;\n      object-fit:contain !important;\n      object-position:center !important;\n    }\n    #live .tile .tag{left:8px;bottom:8px;padding:6px 8px;font-size:8px}\n\n    /* Flyer archive: deliberately smaller cards on phones/tablets. */\n    .poster-rail{\n      grid-template-columns:repeat(2,minmax(0,145px)) !important;\n      justify-content:center;\n      gap:10px !important;\n    }\n    .poster{width:100%;max-width:145px}\n    .poster img,.poster:nth-child(2) img{\n      width:100% !important;\n      height:auto !important;\n      aspect-ratio:3/4 !important;\n      object-fit:contain !important;\n      object-position:center !important;\n    }\n    .poster-cap{padding:6px 1px !important;font-size:7px !important;line-height:1.25}\n  }\n\n  @media (max-width:480px){\n    #sound .era-card img{height:190px !important;max-height:190px !important}\n    #sound .era-copy h3{font-size:27px !important}\n    #live .gallery{max-width:340px}\n    #live .tile.tall:first-child{max-width:320px}\n    .poster-rail{grid-template-columns:repeat(2,minmax(0,132px)) !important}\n    .poster{max-width:132px}\n  }\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine mobile media sizing [skip ci]"
          git push
