name: Patch CMS runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cms-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add CMS runtime script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/cms-runtime.js?v=20260910-1"></script>'
          if tag in s:
              raise SystemExit('CMS runtime already present')
          if '</body>' not in s:
              raise SystemExit('No closing body tag')
          p.write_text(s.replace('</body>',tag+'\n</body>',1),encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load site content from Supabase CMS [skip ci]"
          git push