name: Patch booking copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-booking-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update booking text and cache version
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Choose the type of event and send DJ Breeze the details. The form works directly on the page; the final send opens your email app once the booking address is connected.', 'Choose the type of event and send DJ Breeze the details. Booking requests are sent directly to the DJ Breeze admin dashboard.')
          s = s.replace('Prepare booking request ↗', 'Send booking request ↗')
          s = s.replace('js/app.js?v=20260910-3', 'js/app.js?v=20260910-4')
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route booking requests to admin inbox [skip ci]"
          git push
