name: Mobile media v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-media-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace conflicting mobile media rules with balanced layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('  /* Mobile media scale v2:')
          end=s.find('</style>', start)
          if start != -1 and end != -1:
              s=s[:start] + s[end:]
          css='''\n  /* Final balanced mobile media layout. */\n  @media (max-width:980px){\n    #sound .era-grid{gap:12px !important}\n    #sound .era-card{\n      width:min(100%,620px) !important;\n      max-width:620px !important;\n      margin-inline:auto !important;\n      min-height:0 !important;\n      height:auto !important;\n      display:flex !important;\n      flex-direction:column !important;\n    }\n    #sound .era-card img{\n      position:relative !important;\n      inset:auto !important;\n      width:100% !important;\n      height:230px !important;\n      max-height:230px !important;\n      object-fit:contain !important;\n      object-position:center !important;\n      transform:none !important;\n      background:#111 !important;\n    }\n    #sound .era-card::after{display:none !important}\n    #sound .era-copy{\n      position:relative !important;\n      left:auto !important;right:auto !important;bottom:auto !important;\n      padding:14px 16px 17px !important;\n      background:#111 !important;\n    }\n    #sound .era-copy h3{font-size:28px !important;line-height:.95 !important;margin:6px 0 8px !important}\n    #sound .era-copy p{font-size:13px !important;line-height:1.4 !important}\n\n    #live .gallery{\n      width:min(100%,620px) !important;\n      max-width:620px !important;\n      margin-inline:auto !important;\n      display:grid !important;\n      grid-template-columns:repeat(2,minmax(0,1fr)) !important;\n      grid-template-rows:none !important;\n      gap:10px !important;\n    }\n    #live .tile,#live .tile.tall,#live .tile.tall:first-child{\n      width:100% !important;\n      max-width:none !important;\n      height:auto !important;\n      min-height:0 !important;\n      aspect-ratio:4/3 !important;\n      grid-column:auto !important;\n      grid-row:auto !important;\n      justify-self:auto !important;\n    }\n    #live .tile img,#live .tile video{\n      width:100% !important;\n      height:100% !important;\n      object-fit:contain !important;\n      object-position:center !important;\n      transform:none !important;\n      background:#0d0d0d !important;\n    }\n    #live .tile .tag{font-size:8px !important;padding:6px 8px !important;left:7px !important;bottom:7px !important}\n\n    .poster-rail{\n      width:min(100%,560px) !important;\n      max-width:560px !important;\n      margin-inline:auto !important;\n      display:grid !important;\n      grid-template-columns:repeat(2,minmax(0,1fr)) !important;\n      gap:10px !important;\n      justify-content:center !important;\n      align-items:start !important;\n    }\n    .poster{width:100% !important;max-width:none !important}\n    .poster img,.poster:nth-child(2) img{\n      width:100% !important;\n      height:auto !important;\n      aspect-ratio:3/4 !important;\n      object-fit:contain !important;\n      object-position:center !important;\n      transform:none !important;\n      background:#0e0e0e !important;\n    }\n    .poster-cap{display:flex !important;font-size:7px !important;padding:5px 1px !important;gap:5px !important}\n    #live.section{padding-bottom:64px !important}\n    .posters{padding-top:64px !important}\n  }\n\n  @media (max-width:520px){\n    #sound .era-card{width:min(100%,460px) !important;max-width:460px !important}\n    #sound .era-card img{height:205px !important;max-height:205px !important}\n    #live .gallery{width:min(100%,500px) !important;max-width:500px !important}\n    .poster-rail{width:min(100%,500px) !important;max-width:500px !important}\n  }\n'''
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Balance mobile media sizing and remove conflicting overrides [skip ci]"
          git push
