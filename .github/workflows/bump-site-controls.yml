name: Bump site controls cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-site-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump site controls version
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('js/site-controls.js?v=20260910-1','js/site-controls.js?v=20260910-2')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh public text controls cache [skip ci]"
          git push
