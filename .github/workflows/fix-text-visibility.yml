name: Fix text and mobile visibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-text-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public website visibility
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n  /* Mobile navigation + readable archive captions. */\n  @media (max-width:980px){\n    .nav{height:auto;min-height:74px;padding:9px 0;background:rgba(7,7,7,.94)}\n    .nav-inner{flex-wrap:wrap;gap:10px 14px}\n    .nav-links{display:flex !important;order:3;width:100%;gap:20px;overflow-x:auto;white-space:nowrap;padding:4px 0 3px;scrollbar-width:none}\n    .nav-links::-webkit-scrollbar{display:none}\n    .nav-links a{flex:0 0 auto;opacity:.88}\n    .site-sound-chip{margin-left:auto}\n  }\n  @media (max-width:640px){\n    .nav{min-height:100px}\n    .nav-links{font-size:10px;gap:18px}\n    .site-sound-chip{padding:8px 10px}\n    .site-sound-chip #siteSoundLabel{display:none}\n    .poster-cap{display:flex !important;flex-direction:column;gap:3px;padding:8px 2px;font-size:8px;line-height:1.35}\n  }\n'''
          marker='  /* Mobile navigation + readable archive captions. */'
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          old='''    <div class="footer-right"><a href="admin/" style="opacity:.55">Admin</a><br>\n      Concept V1 / Static HTML prototype<br>\n      Hero sound stays separate. Site Sound now uses the extended 3-track DJ Breeze website mix. CMS & admin are next-stage features.\n    </div>'''
          new='''    <div class="footer-right">DJ Breeze — Official<br>\n      Hip-Hop / R&amp;B / Throwback / Live\n    </div>'''
          s=s.replace(old,new)
          tag='<script src="js/site-controls.js?v=20260910-1"></script>'
          if tag not in s:
              s=s.replace('<script src="js/cms-runtime.js?v=20260910-2"></script>','<script src="js/cms-runtime.js?v=20260910-2"></script>\n'+tag)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile navigation and public text visibility [skip ci]"
          git push
