name: Mobile media v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-media-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact layout through 980px
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  /* Mobile media scale v4: robust phone breakpoint through 980px. */'
          css='''\n  /* Mobile media scale v4: robust phone breakpoint through 980px. */\n  @media (max-width:980px){\n    #sound .era-grid{gap:10px !important}\n    #sound .era-card{\n      width:min(100%,430px) !important;\n      max-width:430px !important;\n      margin-inline:auto !important;\n      min-height:0 !important;\n      height:auto !important;\n      display:flex !important;\n      flex-direction:column !important;\n    }\n    #sound .era-card img{\n      position:relative !important;\n      inset:auto !important;\n      width:100% !important;\n      height:150px !important;\n      max-height:150px !important;\n      object-fit:contain !important;\n      object-position:center !important;\n      transform:none !important;\n      background:#111 !important;\n    }\n    #sound .era-card::after{display:none !important}\n    #sound .era-copy{\n      position:relative !important;\n      left:auto !important;right:auto !important;bottom:auto !important;\n      padding:10px 12px 13px !important;\n      background:#111 !important;\n    }\n    #sound .era-copy h3{font-size:24px !important;line-height:.95 !important;margin:5px 0 6px !important}\n    #sound .era-copy p{font-size:11px !important;line-height:1.35 !important}\n\n    #live .gallery{\n      width:min(100%,560px) !important;\n      max-width:560px !important;\n      margin-inline:auto !important;\n      display:grid !important;\n      grid-template-columns:repeat(2,minmax(0,1fr)) !important;\n      grid-template-rows:none !important;\n      gap:7px !important;\n    }\n    #live .tile,#live .tile.tall,#live .tile.tall:first-child{\n      width:100% !important;\n      max-width:none !important;\n      height:auto !important;\n      min-height:0 !important;\n      aspect-ratio:4/3 !important;\n      grid-column:auto !important;\n      grid-row:auto !important;\n      justify-self:auto !important;\n    }\n    #live .tile img,#live .tile video{\n      width:100% !important;\n      height:100% !important;\n      object-fit:contain !important;\n      object-position:center !important;\n      transform:none !important;\n      background:#0d0d0d !important;\n    }\n    #live .tile .tag{font-size:7px !important;padding:5px 7px !important;left:6px !important;bottom:6px !important}\n\n    .poster-rail{\n      width:min(100%,520px) !important;\n      max-width:520px !important;\n      margin-inline:auto !important;\n      display:grid !important;\n      grid-template-columns:repeat(3,minmax(0,1fr)) !important;\n      gap:7px !important;\n      justify-content:center !important;\n      align-items:start !important;\n    }\n    .poster{width:100% !important;max-width:none !important}\n    .poster img,.poster:nth-child(2) img{\n      width:100% !important;\n      height:auto !important;\n      aspect-ratio:3/4 !important;\n      object-fit:contain !important;\n      object-position:center !important;\n      transform:none !important;\n      background:#0e0e0e !important;\n    }\n    .poster-cap{display:flex !important;font-size:6px !important;padding:4px 0 !important;gap:4px !important}\n    #live.section{padding-bottom:52px !important}\n    .posters{padding-top:52px !important}\n  }\n\n  @media (max-width:520px){\n    #sound .era-card{width:min(100%,360px) !important;max-width:360px !important}\n    #sound .era-card img{height:124px !important;max-height:124px !important}\n    #live .gallery{width:min(100%,340px) !important;max-width:340px !important}\n    .poster-rail{width:min(100%,340px) !important;max-width:340px !important}\n  }\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply robust compact mobile layout [skip ci]"
          git push
