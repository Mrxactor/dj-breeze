name: Unpack DJ Breeze Pages starter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack website into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .extract
          mkdir .extract
          unzip -q DJ-Breeze-GitHub-Pages-Starter.zip -d .extract
          cp -a .extract/dj-breeze-pages/. .
          rm -rf .extract
          rm -f DJ-Breeze-GitHub-Pages-Starter.zip

      - name: Commit website files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Install DJ Breeze GitHub Pages site [skip ci]"
          git push
