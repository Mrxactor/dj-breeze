name: Install locked design master
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-design-master.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install design-master frontend with current backend hooks
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > index.html
      - name: Commit frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Lock uploaded design master and preserve Supabase frontend hooks [skip ci]"
          git push
