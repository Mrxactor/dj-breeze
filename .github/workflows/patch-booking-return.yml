name: Patch booking response

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-booking-return.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking POST response mode
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          old = "'Prefer': 'return=representation'"
          new = "'Prefer': 'return=minimal'"
          if old not in s:
              raise SystemExit('Expected booking Prefer header not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Use minimal response for public booking inserts [skip ci]"
          git push
